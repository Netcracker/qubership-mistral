{{- if eq (include "mistral.k8sSaAuthEnabled" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mistral-token-reviewer-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mistral-token-reviewer
subjects:
  - kind: ServiceAccount
    name: mistral-api-sa
    namespace: {{ .Release.Namespace }}
{{- end }}
