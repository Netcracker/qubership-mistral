version: '3.0'

services:
  
  proxy:
    build: .
    ports:
      - "5433:5433"
    environment:
      POSTGRES_URL: "postgres:5432"
    networks:
      - postgres

  postgres:
    image: postgres:10.23-alpine@sha256:63cfb6eac6b362c7c994f22c3804c61b31898cf0cb52f8e7e86bd99a244f4366
    networks:
      - postgres

networks:
  postgres:

