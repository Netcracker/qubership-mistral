version: '3.0'

services:
  
  proxy:
    build: .
    ports:
      - "5433:5433"
    environment:
      POSTGRES_URL: "postgres:5432"
    networks:
      - postgres

  postgres:
    image: postgres:10.1-alpine@sha256:d6150452877361e26d0fd178d278af8f80d59c75cbb5c2413cfb4fdb5ed4f750
    networks:
      - postgres

networks:
  postgres:

